<!DOCTYPE html>
<!--
  Source template for the social share card (Open Graph / Twitter).
  Rendered to public/og-image.png at 1200x630 via headless Chrome:

  chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
         --window-size=1200,630 --virtual-time-budget=5000 \
         --screenshot=public/og-image.png file:///<abs-path>/og-card.html
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      background: #0D0D0D;
      background-image: radial-gradient(#1d1d1d 1.6px, transparent 1.6px);
      background-size: 30px 30px;
      font-family: 'Space Grotesk', sans-serif;
      color: #F0F0F0;
    }

    .frame {
      position: absolute;
      inset: 34px;
      border: 4px solid #F0F0F0;
      box-shadow: 14px 14px 0 #22D1EE;
      background: #0D0D0D;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ---- Brand stack (top-right) ---- */
    .top {
      position: absolute;
      top: 48px;
      right: 56px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      color: #9E9E9E;
      border: 3px solid #2a2a2a;
      padding: 8px 16px;
    }

    .url {
      font-family: 'DM Sans', sans-serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      color: #F0F0F0;
      border: 3px solid #2a2a2a;
      padding: 8px 16px;
    }

    /* ---- Main ---- */
    .name {
      font-size: 86px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -3px;
    }

    .title-bar {
      display: inline-block;
      align-self: flex-start;
      background: #22D1EE;
      color: #0D0D0D;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -1px;
      padding: 9px 18px;
      margin-top: 30px;
      border: 3px solid #F0F0F0;
      box-shadow: 6px 6px 0 #0D0D0D;
    }

    .tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      color: #C8C8C8;
      margin-top: 28px;
      max-width: 880px;
      line-height: 1.45;
    }

    /* ---- Chips ---- */
    .chips {
      display: flex;
      gap: 12px;
      flex-wrap: nowrap;
      margin-top: 36px;
    }

    .chip {
      font-family: 'DM Sans', sans-serif;
      font-size: 20px;
      font-weight: 500;
      white-space: nowrap;
      background: #181818;
      padding: 11px 16px;
      border: 3px solid #F0F0F0;
      border-left-width: 8px;
    }

    .chip.cyan { border-left-color: #22D1EE; }
    .chip.orange { border-left-color: #FFB380; }
    .chip.green { border-left-color: #6BCB77; }
    .chip.purple { border-left-color: #D4A5FF; }

  </style>
</head>

<body>
  <div class="frame">
    <div class="top">
      <div class="brand">
        <span class="eyebrow">Engineering Portfolio</span>
        <span class="url">nayeemfardin.vercel.app</span>
      </div>
    </div>

    <div class="main">
      <div class="name">NAYEEM<br />FARDIN</div>
      <div class="title-bar">AI-Native Systems Engineer</div>
      <div class="tagline">AI systems — computer vision, RAG, LLM pipelines — built on
        production-grade backend foundations: queues, observability, and reliability.</div>
    </div>

    <div class="chips">
      <span class="chip cyan">Computer Vision</span>
      <span class="chip orange">RAG / LLM Pipelines</span>
      <span class="chip green">Distributed Systems</span>
      <span class="chip purple">Kubernetes · AWS</span>
    </div>
  </div>
</body>

</html>
